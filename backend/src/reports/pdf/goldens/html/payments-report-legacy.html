<!DOCTYPE html>
<html lang="es">
<head>
  <style>
    :root {
      --primary-color: #0c9ea1;
      --primary-color-light: #dbf7f8;
      --text-main: #0e2728;
      --text-muted: #597b7d;
      --border-color: #cbdedf;
      --estado-activo: #10b981;
      --estado-inactivo: #ef4444;
    }
  </style>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Abonos</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #333;
            background-color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        @page {
            margin: 0;
            size: A4 portrait;
        }

        .report-container {
            background-color: #fff;
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Cabecera del Reporte */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            font-weight: normal;
        }

        .page-num {
            font-size: 12px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            font-weight: normal;
            margin: 10px 0;
        }

        .date-range {
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .date-range span {
            margin: 0 20px;
        }

        .report-type {
            text-align: right;
            font-size: 12px;
            margin-bottom: 5px;
        }

        /* Tabla de Datos */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead th {
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            padding: 4px 2px;
            font-weight: normal;
            text-align: left;
        }

        /* Alineaciones específicas de columnas */
        th.col-factura, td.col-factura { width: 12%; }
        th.col-fecha, td.col-fecha { width: 14%; }
        th.col-cliente, td.col-cliente { width: 30%; }
        th.col-cuenta, td.col-cuenta { width: 8%; }
        th.col-medidor, td.col-medidor { width: 8%; }
        th.col-emision, td.col-emision { width: 14%; text-align: right; }
        th.col-valor, td.col-valor { width: 14%; text-align: right; }

        td {
            padding: 3px 2px;
            vertical-align: top;
        }

        /* Fila de Totales */
        .total-row td {
            padding-bottom: 15px; /* Espacio extra después de cada total */
        }

        .total-label {
            text-align: right;
            padding-right: 10px;
        }

        .total-value {
            text-align: right;
        }

        /* Línea superior para los totales */
        .border-top-total {
            border-top: 1px solid #ccc;
            padding-top: 2px;
        }

        /* Clases auxiliares */
        .text-right {
            text-align: right;
        }
    </style>
</head>
<body>

<div class="report-container">

    <div class="header-row">
        <div style="width: 100px;"></div> <div class="title">Junta Administradora del Sistema</div>
        <div></div>
    </div>

    <div class="subtitle">REPORTE DE ABONOS</div>

    <div class="date-range">
        <span>Desde: 2024-05-01</span>
        <span>Hasta: 2024-05-20</span>
    </div>

    <div class="report-type">
        DETALLADO
    </div>

    <table>
        <thead>
            <tr>
                <th class="col-factura">FACTURA</th>
                <th class="col-fecha">FECHA</th>
                <th class="col-cliente">CLIENTE</th>
                <th class="col-cuenta">CUENTA</th>
                <th class="col-medidor">MEDIDOR</th>
                <th class="col-emision">EMISION</th>
                <th class="col-valor">VALOR</th>
            </tr>
        </thead>
        <tbody>
                <tr>
                    <td class="col-factura">F-001</td>
                    <td class="col-fecha">20/05/2024</td>
                    <td class="col-cliente">Ana Pérez</td>
                    <td class="col-cuenta">10</td>
                    <td class="col-medidor">M-001</td>
                    <td class="col-emision text-right">ABRIL 2024</td>
                    <td class="col-valor text-right">25.00</td>
                </tr>
                <tr class="total-row">
                    <td colspan="4"></td>
                    <td colspan="2" class="total-label border-top-total">TOTAL FACTURA: F-001 &gt;</td>
                    <td class="total-value border-top-total">25.00</td>
                </tr>
        </tbody>
    </table>

</div>

</body>
</html>
