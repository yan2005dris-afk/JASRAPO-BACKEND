apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/yan2005dris-afk/jasrapo-backend:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: jasrapo-backend-runtime
          env:
            - name: NODE_ENV
              value: staging
            - name: PORT
              value: "3000"
            - name: STORAGE_ENDPOINT
              value: rustfs
            - name: STORAGE_PORT
              value: "9000"
            - name: STORAGE_USE_SSL
              value: "false"
            - name: STORAGE_SSL_VERIFY
              value: "false"
            - name: PUPPETEER_EXECUTABLE_PATH
              # ELF binary, not /usr/bin/chromium (wrapper script rejected by Puppeteer 25).
              value: /usr/lib/chromium/chromium
          readinessProbe:
            httpGet:
              path: /api/v1/health/pdf
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health/pdf
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
