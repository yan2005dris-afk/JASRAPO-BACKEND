services:
  # ─── Base de datos PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jasrapo-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    ports:
      - "5432:5432" # Puerto solicitado: 5432 (Estándar)
    volumes:
      - ./backend-db/postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - jasrapo-network

  # ─── MinIO Object Storage ────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio-server
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    volumes:
      - ./backend-db/minio-data:/data:Z
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - jasrapo-network

  # ─── Backend NestJS ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: jasrapo-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Conexión interna siempre al 5432 del contenedor
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppass}@postgres:5432/${POSTGRES_DB:-appdb}
      MINIO_ENDPOINT: minio
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - jasrapo-network

networks:
  jasrapo-network:
    driver: bridge
