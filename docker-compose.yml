services:
  # ─── Base de datos PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jasrapo-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./backend-db/postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jasrapo-network

  # ─── MinIO Object Storage ────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio-server
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_DEFAULT_BUCKETS: avatars
    volumes:
      - ./backend-db/minio-data:/data:Z
    networks:
      - jasrapo-network
    command: server /data --console-address ":9001"

  # ─── Backend NestJS ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: jasrapo-backend
    env_file:
      - .env
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - jasrapo-network
    restart: unless-stopped

  # ─── Frontend Angular + Nginx ─────────────────────────────────
  frontend:
    build:
      context: ./FRONT
      dockerfile: Dockerfile
      target: production
    container_name: jasrapo-frontend
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    ports:
      - "${FRONTED_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - jasrapo-network
    restart: unless-stopped

  # ─── Redis Cache/Sessions ───────────────────────────────────
  redis:
    image: redis:alpine
    container_name: jasrapo-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./backend-db/redis-data:/data:Z
    networks:
      - jasrapo-network
    restart: unless-stopped

networks:
  jasrapo-network:
    driver: bridge
