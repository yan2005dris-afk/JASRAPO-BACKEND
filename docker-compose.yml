services:
  # ─── Base de datos PostgreSQL ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jasrapo-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./backend-db/postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - jasrapo-network

  # ─── MinIO Object Storage ────────────────────────────────────
  minio:
    image: minio/minio
    container_name: minio-server
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_DEFAULT_BUCKETS: avatars
    volumes:
      - ./backend-db/minio-data:/data:Z
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - jasrapo-network

  # ─── Backend NestJS ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: jasrapo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - jasrapo-network

networks:
  jasrapo-network:
    driver: bridge
