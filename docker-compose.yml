services:
  # ─── Base de datos PostgreSQL ────────────────────────────────
  postgres:
    build: ./backend-db/postgres
    container_name: jasrapo-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jasrapo-network

  # ─── Backend NestJS ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: jasrapo-backend
    env_file:
      - .env
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: "*"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jasrapo-network
    restart: unless-stopped

  # ─── Frontend Angular + Nginx ─────────────────────────────────
  frontend:
    build:
      context: ./FRONT
      dockerfile: Dockerfile
      target: production
    container_name: jasrapo-frontend
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    ports:
      - "${FRONTED_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - jasrapo-network
    restart: unless-stopped

volumes:
  postgres_data:


networks:
  jasrapo-network:
    driver: bridge
