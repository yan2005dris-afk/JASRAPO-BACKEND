services:
  # ─── Backend NestJS ─────────────────────────────
  - type: web
    name: jasrapo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MINIO_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: jasrapo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

databases:
  # ─── PostgreSQL gestionado por Render ─────────────────────────────
  - name: jasrapo-db
    plan: free
    databaseName: appdb
    user: appuser
