packages:
  - 'backend'

overrides:
  xmldom: 'npm:@xmldom/xmldom@^0.9.10'
  protobufjs: '^8.2.0'
  uuid: '^11.1.1'
  path-to-regexp: '^8.3.0'
  lodash: '^4.17.23'
  handlebars: '^4.7.9'
  esbuild: '^0.28.1'
  '@hono/node-server': '^1.19.13'
  crypto-js: '^4.2.0'
  undici: '^8.5.0'
  '@opentelemetry/core': '^2.8.0'
  js-yaml: '^4.3.0'
  # --- security audit overrides (added 2026-07-22) ---
  multer: '^2.2.0'                              # GHSA-72gw-mp4g-v24j
  nodemailer: '^9.0.1'                          # GHSA-p6gq-j5cr-w38f
  brace-expansion: '^2.1.2'                     # GHSA-3jxr-9vmj-r5cp (>=2.0.0 <2.1.2 patched in 2.1.2; >=3.0.0 <5.0.7 never affects since no v3/v4 pinned)
  axios: '^1.18.0'                              # GHSA-gcfj-64vw-6mp9
  '@opentelemetry/propagator-jaeger': '^2.9.0'  # GHSA-45rx-2jwx-cxfr
  linkify-it: '^5.0.2'                          # GHSA-v245-v573-v5vm
  fast-uri: '^3.1.4'                            # GHSA-4c8g-83qw-93j6 / GHSA-v2hh-gcrm-f6hx
  svgo: '^4.0.2'                                # GHSA-2p49-hgcm-8545
  # --- useragent transitive deps (PR #174) ---
  tmp: '^0.2.4'                                 # GHSA-ph9p-34f9-6g65 (Path Traversal, high)
  form-data: '^4.0.4'                           # GHSA-fjxv-7rqg-78g4 / GHSA-hmw2-7cc7-3qxx (unsafe random CRITICAL + CRLF)
  semver: '^7.6.4'                              # GHSA-c2qf-rxjj-qqgw (ReDoS, high)

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  'bcrypt': true
  'cpu-features': true
  'esbuild': true
  'prisma': true
  'protobufjs': true
  puppeteer: true
  'ssh2': true
  'unrs-resolver': true
  sharp: true
