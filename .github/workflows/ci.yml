name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    # Ejecutar desde la raíz del workspace para mantener consistentes
    # la resolución del lockfile y los scripts filtrados.
    working-directory: ./

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Run ESLint
        run: pnpm --filter backend run lint

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Run tests with coverage
        run: pnpm --filter backend run test:cov

      - name: Verify installation lifecycle with PostgreSQL
        run: pnpm --filter backend exec jest --config test/jest-integration.json --runInBand --runTestsByPath src/operations/routes/infrastructure/repositories/installation-lifecycle.integration.spec.ts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./backend/coverage
          flags: unittests
          name: jasrapo-backend

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Build application
        run: pnpm --filter backend run build

  pdf-contract:
    name: PDF contract (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --filter backend exec puppeteer browsers install chrome

      - name: Render every registered PDF family
        env:
          PDF_CONTRACT_OUTPUT_DIR: tmp/pdfs/pdf-contract
        run: pnpm --filter backend run test:pdf:contract

      - name: Upload reviewed PDF candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-contract-renders
          path: backend/tmp/pdfs/pdf-contract
          retention-days: 7

  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (lockfile-only, no native builds)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run pnpm audit (production deps, fail on high+)
        # Falla el job ante cualquier hallazgo de severidad >= high en dependencias
        # de producción. continue-on-error queda en false: un hallazgo debe romper
        # el check, no solo reportarse en el log.
        run: pnpm audit --prod --audit-level=high

  docker-smoke:
    name: Docker Compose Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare environment file
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 <<'PY'
          import re
          import subprocess
          from pathlib import Path

          env_path = Path('.env')
          content = env_path.read_text()
          for key in ('JWT_ACCESS_SECRET', 'JWT_REFRESH_SECRET', 'ENCRYPTION_KEY'):
              value = subprocess.check_output(
                  ['openssl', 'rand', '-hex', '32'], text=True
              ).strip()
              content, replacements = re.subn(
                  rf'(?m)^{re.escape(key)}=.*$', f'{key}={value}', content, count=1
              )
              if replacements != 1:
                  raise RuntimeError(f'{key} was not found exactly once in .env')
          env_path.write_text(content)
          PY

      - name: Ensure RustFS TLS certificates
        run: |
          mkdir -p certs
          rm -f certs/rustfs_cert.pem certs/rustfs_key.pem
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/rustfs_key.pem \
            -out certs/rustfs_cert.pem \
            -days 365 \
            -subj "/C=EC/ST=Pichincha/L=Quito/O=JASRAPO/OU=ci/CN=localhost" \
            -addext "subjectAltName=DNS:rustfs,DNS:localhost,IP:127.0.0.1" \
            2>/dev/null
          chmod 644 certs/rustfs_key.pem certs/rustfs_cert.pem

      - name: Build Backend Image
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose build backend

      - name: Start Database and Storage
        run: docker compose up -d postgres rustfs

      - name: Wait for Database and Storage Health
        run: |
          set -euo pipefail
          for i in {1..30}; do
            all_healthy=true
            for service in postgres rustfs; do
              container_id="$(docker compose ps -q "$service")"
              if [ -z "$container_id" ]; then
                all_healthy=false
                continue
              fi

              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [ "$state" = "exited" ] || [ "$state" = "dead" ] || [ "$health" = "unhealthy" ]; then
                echo "$service failed: state=$state health=$health" >&2
                exit 1
              fi
              if [ "$health" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "$all_healthy" = true ]; then
              echo "Postgres and RustFS are healthy."
              exit 0
            fi
            echo "Waiting for Postgres and RustFS... ($i/30)"
            sleep 5
          done
          echo "Timed out waiting for Postgres and RustFS health." >&2
          exit 1

      - name: Migrate and Seed Database
        run: >-
          docker compose run --rm --no-deps backend sh -c
          './node_modules/.bin/prisma migrate deploy &&
          ./node_modules/.bin/tsx prisma/schema/seed.ts'

      - name: Start Backend
        run: docker compose up -d backend

      - name: Wait for Backend Health
        run: |
          set -euo pipefail
          for i in {1..36}; do
            container_id="$(docker compose ps -q backend)"
            if [ -z "$container_id" ]; then
              echo "Backend container was not created." >&2
              exit 1
            fi

            state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ] || [ "$health" = "unhealthy" ]; then
              echo "Backend failed: state=$state health=$health" >&2
              exit 1
            fi
            if [ "$state" = "running" ] && [ "$health" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend health... ($i/36) state=$state health=$health"
            sleep 5
          done
          echo "Timed out waiting for backend health." >&2
          exit 1

      - name: Smoke Test Health Endpoint
        run: curl --fail-with-body http://localhost:3000/api/v1/health/pdf

      - name: Inspect Backend Logs on Failure
        if: failure()
        run: |
          docker compose logs --no-color backend postgres rustfs || true

      - name: Teardown Services
        if: always()
        run: |
          docker compose down
