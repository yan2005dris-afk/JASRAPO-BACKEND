name: Update submodule in main repo (Backend)

on:
  push:
    branches: [ develop ]   # rama que uses en backend

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout main repo (JASRAPO)
        uses: actions/checkout@v4
        with:
          repository: Brydyan/JASRAPO
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: main-repo
          submodules: false

      - name: Update backend submodule
        run: |
          cd main-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          cd backend
          git fetch origin
          git checkout develop
          git pull origin develop
          cd ..
          
          git add backend
          if git diff --staged --quiet; then
            echo "No hay cambios en el submodulo backend"
          else
            git commit -m "Actualizar submódulo backend a ${{ github.sha }}"
            git push origin develop
          fi
