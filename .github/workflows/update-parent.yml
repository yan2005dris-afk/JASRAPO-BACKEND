name: Actualiza submódulo 'backend' en JASRAPO develop si cambia develop de backend

on:
  push:
    branches: [ develop ]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Configura autenticación para submódulos privados
        run: |
          git config --global url."https://${{ secrets.PERSONAL_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      
      - name: Clona repo padre (JASRAPO) con submódulos
        uses: actions/checkout@v4
        with:
          repository: Brydyan/JASRAPO
          ref: develop
          token: ${{ secrets.PERSONAL_TOKEN }}
          submodules: 'recursive'
          fetch-depth: 0
          path: jasrapo

      - name: Actualiza submódulo backend a última de develop
        run: |
          cd jasrapo
          git submodule update --init --recursive
          cd backend
          git fetch origin develop
          git checkout origin/develop
          cd ..
          git add backend
          git status

      - name: Commit y push en JASRAPO develop
      working-directory: jasrapo
      env:
        GIT_AUTHOR_NAME: github-actions
        GIT_AUTHOR_EMAIL: actions@github.com
      run: |
        git config user.name "$GIT_AUTHOR_NAME"
        git config user.email "$GIT_AUTHOR_EMAIL"
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update submodule backend: develop actualizado a ${{ github.sha }}"
          git push origin develop
        else
          echo "No hay cambios en el submódulo para commitear."
