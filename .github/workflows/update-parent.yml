name: Update submodule in main repo (Backend)

on:
  push:
    branches: [ develop ]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend repo (opcional, para usar su código/fetch SHA)
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout main repo (JASRAPO)
        uses: actions/checkout@v4
        with:
          repository: Brydyan/JASRAPO
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: main-repo
          submodules: false

      - name: Inicializa el submódulo backend en JASRAPO
        run: |
          cd main-repo
          git submodule update --init --recursive
          ls -lAh
          
      - name: Update backend submodule reference
        run: |
          cd main-repo/backend
          git fetch origin develop
          git checkout origin/develop
          cd ..
          git add backend
          if git diff --cached --quiet; then
            echo "No hay cambios en el submódulo backend"
          else
            git commit -m "Actualizar submódulo backend a ${{ github.sha }}"
            git push origin develop
          fi
