name: Actualiza backend en JASRAPO cuando cambia develop

on:
  push:
    branches:
      - develop

jobs:
  actualizar-backend:
    runs-on: ubuntu-latest
    steps:
      # Clona el repo padre (JASRAPO) con los submódulos
      - name: Clona repo padre (JASRAPO)
        uses: actions/checkout@v4
        with:
          repository: Brydyan/JASRAPO
          token: ${{ secrets.PERSONAL_TOKEN }}
          submodules: true
          fetch-depth: 0

      # Sincroniza e inicializa los submódulos completamente (por seguridad)
      - name: Sincroniza e inicializa submódulos
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # Actualiza solo el submódulo backend a su último commit en develop
      - name: Actualiza referencia del submódulo backend
        run: |
          cd backend
          git fetch origin develop
          git checkout origin/develop
          cd ..
          git add backend

      # Commit y push de la nueva referencia del submódulo
      - name: Commit y Push de cambios en submódulo backend
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: actions@github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update submodule backend: sincronizado con develop"
            git push origin main
          else
            echo "No hay cambios en el submódulo para commitear."
          fi
